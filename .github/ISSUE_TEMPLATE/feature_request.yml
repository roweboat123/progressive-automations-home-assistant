name: Feature request
description: Suggest an integration or dashboard improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: request
    attributes:
      label: Requested feature
      description: Describe the behavior you would like to add or change.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Explain how this would be used with the RT-BT1 or attached actuator.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Protocol / hardware evidence (if applicable)
      description: For new BLE behavior, include captures, app behavior, or repeatable hardware observations if available.
